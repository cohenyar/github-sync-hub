    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: a slow/blocked Google Fonts response must never
         hold up first paint (that was the long black screen). -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0b1220;
      }
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        color: #93a4c3;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot-splash .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(120, 160, 255, 0.25);
        border-top-color: rgba(120, 180, 255, 0.9);
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring"></div>
        <span>טוען את מרידיאן…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
