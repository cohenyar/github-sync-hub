<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>מרידיאן — פלטפורמת למידה בעברית</title>
    <meta name="description" content="מרידיאן היא פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי עם דמויות מורים." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="מרידיאן — פלטפורמת למידה בעברית" />
    <meta property="og:description" content="פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="מרידיאן — פלטפורמת למידה בעברית" />
    <meta name="twitter:description" content="פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: a slow/blocked Google Fonts response must never
         hold up first paint (that was the long black screen). -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0b1220;
      }
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        color: #93a4c3;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot-splash .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(120, 160, 255, 0.25);
        border-top-color: rgba(120, 180, 255, 0.9);
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-retry {
        display: none;
        border: 1px solid rgba(120, 180, 255, 0.55);
        border-radius: 8px;
        padding: 0.65rem 1rem;
        color: #dbeafe;
        background: rgba(30, 64, 175, 0.25);
        font: inherit;
        cursor: pointer;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring"></div>
        <span>טוען את מרידיאן…</span>
        <button id="boot-retry" type="button">רענון מהיר</button>
      </div>
    </div>
    <script>
      // --- Temporary startup instrumentation -------------------------------
      // Records when each boot stage completes plus any uncaught error, so a
      // stalled preview load can report exactly where it stopped instead of
      // only showing a spinner. In-memory only.
      ;(function () {
        var t0 = performance.now()
        var boot = {
          t0: t0,
          marks: [],
          errors: [],
          mark: function (stage) {
            boot.marks.push({ stage: stage, ms: Math.round(performance.now() - t0) })
          },
        }
        window.__meridianBoot = boot
        boot.mark('html-parsed')

        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && target !== window && target.tagName) {
            boot.errors.push('resource failed: ' + (target.src || target.href || target.tagName))
            return
          }
          boot.errors.push('error: ' + (event.message || String(event.error)))
        }, true)

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          boot.errors.push('unhandledrejection: ' + ((reason && (reason.message || reason)) || 'unknown'))
        })
      })()

      // Bounded fail-safe only: never auto-reloads (a slow but valid boot must
      // be allowed to finish). If React still hasn't mounted after 8s, the
      // spinner is replaced by a readable message plus a manual refresh
      // button, so the splash can never be a dead end. It now also reports
      // the last completed boot stage and any captured error.
      window.setTimeout(function () {
        var splash = document.getElementById('boot-splash')
        if (!splash) return

        var boot = window.__meridianBoot || { marks: [], errors: [] }
        var last = boot.marks.length ? boot.marks[boot.marks.length - 1] : null
        var report = {
          lastStage: last ? last.stage : 'none',
          elapsedMs: Math.round(performance.now() - (boot.t0 || 0)),
          marks: boot.marks,
          errors: boot.errors,
        }
        var reportText = JSON.stringify(report, null, 2)
        console.error('[meridian boot stalled]', report)

        var label = splash.querySelector('span')
        var ring = splash.querySelector('.ring')
        var retry = document.getElementById('boot-retry')
        if (label) label.textContent = 'הטעינה מתעכבת — אפשר לרענן'
        if (ring) ring.style.display = 'none'
        if (retry) {
          retry.style.display = 'block'
          retry.onclick = function () {
            window.location.reload()
          }
        }

        var diag = document.getElementById('boot-diagnostics')
        if (diag) {
          diag.style.display = 'block'
          diag.textContent =
            'שלב אחרון: ' +
            report.lastStage +
            ' (' +
            report.elapsedMs +
            'ms)' +
            (report.errors.length ? '\n' + report.errors.join('\n') : '')
        }
        var copy = document.getElementById('boot-copy')
        if (copy) {
          copy.style.display = 'block'
          copy.onclick = function () {
            if (navigator.clipboard) navigator.clipboard.writeText(reportText)
            copy.textContent = 'הועתק'
          }
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>


  </body>
</html>
