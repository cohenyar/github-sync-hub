    <title>מרידיאן — פלטפורמת למידה בעברית</title>
    <meta name="description" content="מרידיאן היא פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי עם דמויות מורים." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="מרידיאן — פלטפורמת למידה בעברית" />
    <meta property="og:description" content="פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="מרידיאן — פלטפורמת למידה בעברית" />
    <meta name="twitter:description" content="פלטפורמת למידה בעברית לתרגול מתמטיקה ואנגלית, בתוך עולם תלת־ממדי אינטראקטיבי." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: a slow/blocked Google Fonts response must never
         hold up first paint (that was the long black screen). -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0b1220;
      }
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        color: #93a4c3;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot-splash .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(120, 160, 255, 0.25);
        border-top-color: rgba(120, 180, 255, 0.9);
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-retry {
        display: none;
        border: 1px solid rgba(120, 180, 255, 0.55);
        border-radius: 8px;
        padding: 0.65rem 1rem;
        color: #dbeafe;
        background: rgba(30, 64, 175, 0.25);
        font: inherit;
        cursor: pointer;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring"></div>
        <span>טוען את מרידיאן…</span>
        <button id="boot-retry" type="button">רענון מהיר</button>
      </div>
    </div>
    <script>
      // The preview can occasionally retain a stale Vite module after an
      // asset rename. Never leave the visitor trapped behind an endless
      // spinner: retry once with a clean URL, then expose a manual refresh.
      window.setTimeout(function () {
        var splash = document.getElementById('boot-splash')
        if (!splash) return

        var retryKey = 'meridian:boot-retry'
        if (!window.sessionStorage.getItem(retryKey)) {
          window.sessionStorage.setItem(retryKey, '1')
          var url = new URL(window.location.href)
          url.searchParams.set('_boot', Date.now().toString())
          window.location.replace(url.toString())
          return
        }

        var label = splash.querySelector('span')
        var ring = splash.querySelector('.ring')
        var retry = document.getElementById('boot-retry')
        if (label) label.textContent = 'הטעינה נעצרה — אפשר לרענן מיד'
        if (ring) ring.style.display = 'none'
        if (retry) {
          retry.style.display = 'block'
          retry.onclick = function () {
            window.sessionStorage.removeItem(retryKey)
            window.location.reload()
          }
        }
      }, 4000)
    </script>
    <!-- Version the development entry so a preview that cached an older Vite
         module graph cannot keep requesting renamed assets forever. Vite
         strips and bundles this normally in production builds. -->
    <script type="module" src="/src/main.tsx?v=20260807-1"></script>
  </body>
</html>
